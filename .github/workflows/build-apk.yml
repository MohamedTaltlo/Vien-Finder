name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Vien-Finder.apk
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vien-Finder-Android
          path: Vien-Finder.apk
          retention-days: 30
      - name: Create downloadable release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: Vien Finder v1.2.0
          files: Vien-Finder.apk
          body: |
            Vien Finder v1.2.0 — GPU contrast correction for Galaxy A56.
            Rebuilt enhancement around the camera's real luminance to prevent clipped black/white images.
            Local red-green processing is now gain-limited and edge-gated to reduce false lines and noise.
            New before/after half-screen comparison (مقارنة).
            Softer startup presets: sensitivity 45%, contrast 35%.
            Existing OpenGL GPU pipeline, flash, focus, freeze and exposure controls retained.
            Experimental visible-light contrast enhancement; not a clinical vein-location or depth detector.
            Uninstall earlier v1.x debug builds before installing, as APK signing keys rotate with GitHub Actions.
          draft: false
          prerelease: true
