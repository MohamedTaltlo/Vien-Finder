name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Vien-Finder.apk
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vien-Finder-Android
          path: Vien-Finder.apk
          retention-days: 30
      - name: Create downloadable release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Vien Finder v1.0.0
          files: Vien-Finder.apk
          body: |
            Android vein-contrast camera prototype (Samsung Galaxy A56).
            Install the APK directly from this page.
            Live video, green and red-green contrast modes, flashlight, exposure and adjustable sensitivity.
            Offline processing; no internet or image uploads.
            Experimental contrast enhancement, not a validated vein-mapping device.
          draft: false
          prerelease: true
