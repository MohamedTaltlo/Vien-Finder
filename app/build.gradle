plugins {
    id 'com.android.application'
}
android {
    namespace 'online.vienfinder.app'
    compileSdk 35
    defaultConfig {
        applicationId 'online.vienfinder.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
